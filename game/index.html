<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Heat — an open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0e1a; height: 100%; overflow: hidden; }
  #game { width: 100%; height: 100%; }
  #game canvas { display: block; margin: 0 auto; }
  /* DOM HUD + menus live on top of the canvas. */
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: 'Trebuchet MS', Verdana, sans-serif; color: #fff; z-index: 10; }
  #hud .panel { position: absolute; background: rgba(8, 10, 24, 0.72); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 8px; padding: 8px 12px; }
  #money { top: 12px; left: 12px; font-size: 22px; font-weight: bold; color: #7dff9b; text-shadow: 0 2px 4px #000; }
  #health { top: 56px; left: 12px; width: 180px; }
  #health .bar { height: 12px; background: #333; border-radius: 6px; overflow: hidden; }
  #health .fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff5b5b, #ffb84d); transition: width 0.15s; }
  #wanted { top: 12px; right: 12px; font-size: 26px; letter-spacing: 2px; color: #ffd23e; text-shadow: 0 0 6px #000, 0 2px 4px #000; }
  #wanted .star { color: #3a3f5c; }
  #wanted .star.lit { color: #ffd23e; }
  #objective { bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 16px; text-align: center; max-width: 640px; }
  #objective .title { color: #ffd23e; font-weight: bold; }
  #minimap-wrap { bottom: 14px; left: 12px; padding: 4px; }
  #minimap { display: block; border-radius: 4px; }
  #speed { bottom: 14px; right: 12px; font-size: 20px; font-weight: bold; text-align: right; }
  #banner { top: 22%; left: 50%; transform: translate(-50%, -50%); font-size: 34px; font-weight: bold; color: #ffd23e; text-shadow: 0 0 12px #000, 0 3px 6px #000; text-align: center; display: none; }
  #dialog { bottom: 110px; left: 50%; transform: translateX(-50%); width: 620px; max-width: 90vw; display: none; pointer-events: auto; cursor: pointer; }
  #dialog .who { color: #7dd3ff; font-weight: bold; }
  #dialog .hint { font-size: 12px; color: #aaa; text-align: right; }
  #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; background: linear-gradient(180deg, rgba(11,14,26,0.25) 0%, rgba(11,14,26,0.88) 100%); color: #fff; font-family: 'Trebuchet MS', Verdana, sans-serif; z-index: 20; text-align: center; }
  #menu h1 { font-size: 64px; margin: 0; color: #ffd23e; text-shadow: 0 0 24px rgba(255, 180, 40, 0.55), 0 4px 0 #7a2e0e; letter-spacing: 4px; }
  #menu h2 { font-size: 20px; margin: 6px 0 18px; color: #7dd3ff; font-weight: normal; letter-spacing: 2px; }
  #menu p { max-width: 560px; line-height: 1.5; color: #ddd; }
  #menu button { pointer-events: auto; font-size: 20px; padding: 12px 34px; margin: 6px; border-radius: 8px; border: 2px solid #ffd23e; background: #1a2038; color: #ffd23e; cursor: pointer; font-family: inherit; }
  #menu button:hover { background: #ffd23e; color: #1a2038; }
  #menu .controls { font-size: 14px; color: #bbb; margin-top: 14px; line-height: 1.7; }
  #menu .controls b { color: #fff; }
  #toast { top: 100px; left: 50%; transform: translateX(-50%); font-size: 18px; color: #fff; display: none; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #888; font-family: Verdana, sans-serif; z-index: 5; }
</style>
</head>
<body>
<div id="game"></div>
<div id="loading">Loading Solmar Bay…</div>
<div id="hud" style="display:none">
  <div id="money" class="panel">$0</div>
  <div id="health" class="panel"><div class="bar"><div class="fill" id="health-fill"></div></div></div>
  <div id="wanted" class="panel"><span class="star" data-s="1">★</span><span class="star" data-s="2">★</span><span class="star" data-s="3">★</span><span class="star" data-s="4">★</span><span class="star" data-s="5">★</span></div>
  <div id="minimap-wrap" class="panel"><canvas id="minimap" width="180" height="180"></canvas></div>
  <div id="objective" class="panel"><span class="title"></span><br><span class="text"></span></div>
  <div id="speed" class="panel">0 mph</div>
  <div id="banner"></div>
  <div id="dialog" class="panel"><div class="who"></div><div class="line"></div><div class="hint">click or press E to continue</div></div>
  <div id="toast" class="panel"></div>
</div>
<div id="menu"></div>
<script src="vendor/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
